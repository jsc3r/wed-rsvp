quarkus.container-image.builder=jib
quarkus.container-image.name=localhost/wed-rsvp
quarkus.container-image.tag=latest

quarkus.jib.base-jvm-image=eclipse-temurin:21-jre
quarkus.jib.docker-executable-name=podman
quarkus.jib.jvm-additional-arguments[0]=-Dquarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=h2
quarkus.datasource.username=h2admin
quarkus.datasource.password=h2admin
quarkus.datasource.jdbc.url=jdbc:h2:file:${DB_PATH:../.data/wed-rsvp};DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.mapping.format.global=ignore

quarkus.swagger-ui.always-include=true

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Every REST endpoint must explicitly opt into public or role-based access.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

mp.jwt.verify.issuer=wed-rsvp
mp.jwt.verify.audiences=wed-rsvp-api
mp.jwt.verify.publickey.algorithm=RS256
# SmallRye treats zero as its default (60 seconds); use an explicit small tolerance.
mp.jwt.verify.clock.skew=5
smallrye.jwt.new-token.issuer=${mp.jwt.verify.issuer}
smallrye.jwt.new-token.audience=${mp.jwt.verify.audiences}

# Dev/test use Quarkus-generated keys. Production requires an externally managed pair.
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

# Optional initial admin provisioning. Existing accounts retain their stored password and roles.
# Keep the disabled state representable to SmallRye Config; empty values are treated as missing.
app.auth.admin.username=${ADMIN_USERNAME:__unset__}
app.auth.admin.password-hash=${ADMIN_PASSWORD_HASH:__unset__}
